<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ความสนใจ & ทักษะ | Teerachot Sriwong</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ff4081; --pink-dark: #c2185b; --pink-light: #ffe4ec;
            --bg-light: #fff5f8; --card-bg: rgba(255, 255, 255, 0.94); --text-main: #2d2d3a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Smooth Scroll สำหรับเลื่อนนุ่มนวล */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #ffffff 0%, var(--bg-light) 100%);
            color: var(--text-main);
        }

        .card {
            position: relative; z-index: 10; width: 100%; max-width: 850px;
            background: var(--card-bg); border-radius: 20px; padding: 40px;
            backdrop-filter: blur(12px); border: 1px solid rgba(255, 64, 129, 0.25);
            box-shadow: 0 10px 35px rgba(255, 64, 129, 0.12);
        }

        .corner {
            position: absolute; width: 20px; height: 20px; pointer-events: none;
            filter: drop-shadow(0 0 3px var(--pink-main));
        }
        .tl { top: 12px; left: 12px; border-top: 3px solid var(--pink-main); border-left: 3px solid var(--pink-main); }
        .tr { top: 12px; right: 12px; border-top: 3px solid var(--pink-main); border-right: 3px solid var(--pink-main); }
        .bl { bottom: 12px; left: 12px; border-bottom: 3px solid var(--pink-main); border-left: 3px solid var(--pink-main); }
        .br { bottom: 12px; right: 12px; border-bottom: 3px solid var(--pink-main); border-right: 3px solid var(--pink-main); }

        h1 { font-size: 2rem; color: var(--pink-dark); text-align: center; margin-bottom: 15px; }

        /* --- แถบปุ่มทางลัด (Quick Navigation) --- */
        .quick-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            padding: 12px 16px;
            background: rgba(255, 228, 236, 0.6);
            border-radius: 16px;
            border: 1px dashed var(--pink-main);
        }
        .quick-nav-title {
            font-weight: 700;
            color: var(--pink-dark);
            font-size: 0.9rem;
            margin-right: 4px;
        }
        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            background: #ffffff;
            color: var(--pink-dark);
            border: 1px solid var(--pink-main);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .quick-btn:hover {
            background: var(--pink-main);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
        }

        /* --- ปุ่มเลือกทักษะ --- */
        .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tag-btn {
            background: #ffffff; border: 1px solid var(--pink-main); color: var(--pink-dark);
            padding: 10px 18px; border-radius: 25px; cursor: pointer; font-family: inherit;
            font-size: 0.95rem; font-weight: 600; transition: all 0.3s ease;
        }
        .tag-btn:hover, .tag-btn.active {
            background: var(--pink-main); color: #ffffff; transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.35);
        }

        /* --- กล่องแสดงข้อมูล --- */
        .info-box {
            background: #fff0f5; padding: 25px; border-left: 4px solid var(--pink-main);
            border-radius: 12px; min-height: 110px; display: flex; align-items: center;
            justify-content: center; text-align: center; font-size: 1.05rem; line-height: 1.6;
            margin-bottom: 35px; transition: all 0.3s ease; opacity: 1;
            scroll-margin-top: 30px;
        }

        .nav-btns { display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
            border-radius: 30px; font-weight: 600; text-decoration: none; transition: all 0.3s ease;
        }
        .btn-secondary { background: #ffffff; border: 1px solid var(--pink-main); color: var(--pink-dark); }
        .btn-primary { background: linear-gradient(135deg, #ff4081, #d81b60); color: #ffffff; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3); }

        @media (max-width: 600px) {
            .card { padding: 25px 20px; }
            .nav-btns { flex-direction: column; }
            .quick-nav { flex-direction: column; align-items: stretch; text-align: center; }
            .quick-btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>

        <h1>💡 ความสนใจและทักษะ</h1>

        <!-- แถบปุ่มทางลัดไปยังแต่ละหัวข้อ -->
        <div class="quick-nav">
            <span class="quick-nav-title">⚡ ทางลัดหัวข้อ:</span>
            <button class="quick-btn" onclick="quickJump('engineering')">⚙️ Engineering</button>
            <button class="quick-btn" onclick="quickJump('civil')">🏗️ Civil</button>
            <button class="quick-btn" onclick="quickJump('design')">📐 Design & CAD</button>
            <button class="quick-btn" onclick="quickJump('math')">📊 Math</button>
            <button class="quick-btn" onclick="quickJump('problem')">🔧 Problem Solving</button>
            <button class="quick-btn" onclick="quickJump('teamwork')">🤝 Teamwork</button>
        </div>

        <div class="tags">
            <button class="tag-btn active" data-type="engineering" onclick="showInfo('engineering', event)">⚙️ Engineering</button>
            <button class="tag-btn" data-type="civil" onclick="showInfo('civil', event)">🏗️ Civil Engineering</button>
            <button class="tag-btn" data-type="design" onclick="showInfo('design', event)">📐 Structural Design & CAD</button>
            <button class="tag-btn" data-type="math" onclick="showInfo('math', event)">📊 Math & Analysis</button>
            <button class="tag-btn" data-type="problem" onclick="showInfo('problem', event)">🔧 Problem Solving</button>
            <button class="tag-btn" data-type="teamwork" onclick="showInfo('teamwork', event)">🤝 Leadership & Teamwork</button>
        </div>

        <div id="infoBox" class="info-box">
            ⚙️ <strong>Engineering:</strong> การประยุกต์ใช้วิทยาศาสตร์ คณิตศาสตร์ และความคิดสร้างสรรค์เพื่อพัฒนาเทคโนโลยีและนวัตกรรมในการแก้ปัญหาในโลกจริง
        </div>

        <div class="nav-btns">
            <a href="about.html" class="btn btn-secondary">⬅ กลับหน้า ประวัติส่วนตัว</a>
            <a href="target.html" class="btn btn-primary">ไปหน้า เป้าหมายการศึกษา ➔</a>
        </div>
    </main>

    <script>
        const content = {
            engineering: "⚙️ <strong>Engineering:</strong> การประยุกต์ใช้วิทยาศาสตร์ คณิตศาสตร์ และความคิดสร้างสรรค์เพื่อพัฒนาเทคโนโลยีและนวัตกรรมในการแก้ปัญหาในโลกจริง",
            civil: "🏗️ <strong>Civil Engineering:</strong> มีความสนใจเป็นพิเศษในงานออกแบบ ก่อสร้าง และการวางแผนโครงสร้างพื้นฐาน เช่น อาคาร สะพาน และระบบคมนาคม",
            design: "📐 <strong>Structural Design & CAD:</strong> ทักษะการเขียนแบบและออกแบบทางวิศวกรรม เช่น SketchUp และการทำโมเดล 3 มิติเพื่อวิเคราะห์โครงสร้างเบื้องต้น",
            math: "📊 <strong>Math & Analysis:</strong> มีความถนัดด้านคณิตศาสตร์ประยุกต์ ตรรกศาสตร์ และการวิเคราะห์ข้อมูลเพื่อหาโซลูชันที่ปลอดภัยและคุ้มค่าที่สุด",
            problem: "🔧 <strong>Problem Solving:</strong> มีกระบวนการคิดวิเคราะห์อย่างเป็นระบบ (Analytical Thinking) พร้อมรับมือและแก้ไขปัญหาเฉพาะหน้าในการทำงาน",
            teamwork: "🤝 <strong>Leadership & Teamwork:</strong> ทักษะการสื่อสาร การทำงานร่วมกับผู้อื่นในทีม และการบริหารจัดการเวลาเพื่อให้งานสำเร็จตามเป้าหมาย"
        };

        function showInfo(type, event) {
            const btn = event ? event.currentTarget : document.querySelector(`.tag-btn[data-type="${type}"]`);
            if (!btn) return;

            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const box = document.getElementById('infoBox');
            box.style.opacity = '0';
            setTimeout(() => {
                box.innerHTML = content[type];
                box.style.opacity = '1';
            }, 150);
        }

        /* ฟังก์ชันสำหรับปุ่มทางลัด */
        function quickJump(type) {
            showInfo(type);
            const box = document.getElementById('infoBox');
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        /* ตรวจสอบว่ามี Hash ที่ URL หรือไม่ เช่น skills.html#civil */
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash && content[hash]) {
                quickJump(hash);
            }
        });
    </script>
</body>
</html>
