<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Sarabun',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
    position:relative;

    background:
    linear-gradient(
        135deg,
        #29443d,
        #355f52,
        #29443d
    );
}

/* Blueprint Grid */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);

    background-size:40px 40px;
    animation:gridMove 20s linear infinite;
}

@keyframes gridMove{
    from{transform:translate(0,0);}
    to{transform:translate(-40px,-40px);}
}

/* Engineering Circles */

.circle{
    position:absolute;
    border:2px solid rgba(255,255,255,.08);
    border-radius:50%;
}

.circle1{
    width:500px;
    height:500px;
    top:-200px;
    left:-200px;
    animation:rotateSlow 40s linear infinite;
}

.circle2{
    width:350px;
    height:350px;
    bottom:-150px;
    right:-150px;
    animation:rotateSlow 30s linear infinite reverse;
}

@keyframes rotateSlow{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* Floating Lights */

.light{
    position:absolute;
    top:-100px;

    width:6px;
    height:6px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px white,
        0 0 20px #b8ffe0,
        0 0 35px #7fffd4;

    animation:
        fall linear infinite,
        twinkle 3s ease-in-out infinite;
}

.l1{left:5%; animation-duration:12s;}
.l2{left:15%; animation-duration:18s;}
.l3{left:25%; animation-duration:15s;}
.l4{left:35%; animation-duration:20s;}
.l5{left:45%; animation-duration:13s;}
.l6{left:55%; animation-duration:17s;}
.l7{left:65%; animation-duration:14s;}
.l8{left:75%; animation-duration:19s;}
.l9{left:85%; animation-duration:16s;}
.l10{left:95%; animation-duration:21s;}

@keyframes fall{
    from{transform:translateY(-100px);}
    to{transform:translateY(110vh);}
}

@keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
}

/* Card */

.card{
    position:relative;
    z-index:10;

    width:100%;
    max-width:800px;

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    box-shadow:
        0 20px 40px rgba(0,0,0,.25);

    animation:fadeUp 1s ease;
    transition:.4s;
}

.card:hover{
    transform:translateY(-5px);
}

.card::before{
    content:"";
    position:absolute;
    inset:12px;

    border:2px solid #2f4f4f;
    border-radius:12px;
}

.card::after{
    content:"";

    position:absolute;

    width:350px;
    height:350px;

    background:
    radial-gradient(
        rgba(120,255,200,.25),
        transparent 70%
    );

    top:-150px;
    right:-150px;

    z-index:-1;
}

/* Corner Brackets */

.corner{
    position:absolute;
    width:30px;
    height:30px;
}

.tl{
    top:10px;
    left:10px;
    border-top:3px solid #2f4f4f;
    border-left:3px solid #2f4f4f;
}

.tr{
    top:10px;
    right:10px;
    border-top:3px solid #2f4f4f;
    border-right:3px solid #2f4f4f;
}

.bl{
    bottom:10px;
    left:10px;
    border-bottom:3px solid #2f4f4f;
    border-left:3px solid #2f4f4f;
}

.br{
    bottom:10px;
    right:10px;
    border-bottom:3px solid #2f4f4f;
    border-right:3px solid #2f4f4f;
}

.icon{
    font-size:75px;
}

.badge{
    display:inline-block;
    margin:15px 0;
    padding:10px 20px;

    background:#2f4f4f;
    color:white;

    border-radius:30px;
}

h1{
    color:#2f4f4f;
}

.line{
    width:100px;
    height:4px;
    background:#2f4f4f;
    margin:15px auto 25px;
}

.info{
    font-size:18px;
    line-height:1.8;
    color:#333;
}

.highlight{
    color:#2f4f4f;
    font-weight:700;
}

/* Buttons */

.tags{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.tag{
    position:relative;
    overflow:hidden;

    border:none;
    background:#2f4f4f;
    color:white;

    padding:10px 18px;
    border-radius:30px;

    cursor:pointer;
    transition:.3s;
}

.tag:hover{
    transform:translateY(-4px);
    background:#476f6f;
}

.tag.active{
    background:#5d8b8b;
}

/* Ripple */

.ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.6);
    transform:scale(0);
    animation:ripple .6s linear;
}

@keyframes ripple{
    to{
        transform:scale(4);
        opacity:0;
    }
}

/* Info Box */

.info-box{
    margin-top:25px;
    background:#f4f7f6;

    padding:20px;

    border-left:5px solid #2f4f4f;

    border-radius:12px;

    opacity:0;
    transform:translateY(10px);

    transition:.4s;
}

.info-box.show{
    opacity:1;
    transform:translateY(0);
}

.footer{
    margin-top:25px;
    color:#666;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    .card{
        padding:25px;
    }

    .icon{
        font-size:55px;
    }

    h1{
        font-size:1.6rem;
    }

}

</style>

</head>

<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>

<div class="light l1"></div>
<div class="light l2"></div>
<div class="light l3"></div>
<div class="light l4"></div>
<div class="light l5"></div>
<div class="light l6"></div>
<div class="light l7"></div>
<div class="light l8"></div>
<div class="light l9"></div>
<div class="light l10"></div>

<div class="card">

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="icon">⚙️🏗️🧪</div>

<div class="badge">ENGINEERING STUDENT</div>

<h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>

<div class="line"></div>

<p class="info">
สวัสดีครับ! ผมชื่อ
<span class="highlight">
ธีรโชติ ศรีวงศ์ (Natthaphon Chiangrang)
</span>
</p>

<p class="info">
ขณะนี้กำลังศึกษาและสนใจด้าน Engineering
</p>

<p class="info">
นี่คือเว็บไซต์แรกของผมที่โฮสต์บน GitHub Pages
</p>

<div class="tags">

<button class="tag" onclick="showInfo('engineering',event)">⚙️ Engineering</button> <button class="tag" onclick="showInfo('civil',event)">🏗️ Civil</button> <button class="tag" onclick="showInfo('chemical',event)">🧪 Chemical</button> <button class="tag" onclick="showInfo('design',event)">📐 Design</button> <button class="tag" onclick="showInfo('problem',event)">🔧 Problem Solving</button>

</div>

<div id="infoBox" class="info-box">
เลือกหัวข้อด้านบนเพื่อดูรายละเอียด
</div>

<div class="footer">
Building Knowledge • Creating Innovation
</div>

</div>

<script>

function showInfo(type,event){

    document.querySelectorAll('.tag')
    .forEach(btn=>btn.classList.remove('active'));

    event.currentTarget.classList.add('active');

    const ripple=document.createElement('span');
    ripple.classList.add('ripple');

    const rect=event.currentTarget.getBoundingClientRect();

    ripple.style.width='100px';
    ripple.style.height='100px';

    ripple.style.left=(event.clientX-rect.left-50)+'px';
    ripple.style.top=(event.clientY-rect.top-50)+'px';

    event.currentTarget.appendChild(ripple);

    setTimeout(()=>{
        ripple.remove();
    },600);

    const content={

        engineering:
        "⚙️ Engineering คือการประยุกต์ใช้วิทยาศาสตร์ คณิตศาสตร์ และความคิดสร้างสรรค์เพื่อแก้ปัญหาในโลกจริง",

        civil:
        "🏗️ Civil Engineering เกี่ยวข้องกับการออกแบบและก่อสร้างอาคาร ถนน สะพาน เขื่อน และโครงสร้างพื้นฐาน",

        chemical:
        "🧪 Chemical Engineering มุ่งเน้นกระบวนการผลิต การแปรรูปวัตถุดิบ และอุตสาหกรรมเคมี",

        design:
        "📐 Design คือการออกแบบ วางแผน และพัฒนาระบบหรือโครงสร้างให้มีประสิทธิภาพและปลอดภัย",

        problem:
        "🔧 Problem Solving คือหัวใจของงานวิศวกรรมในการวิเคราะห์และแก้ปัญหาอย่างเป็นระบบ"

    };

    const box=document.getElementById('infoBox');

    box.classList.remove('show');

    setTimeout(()=>{
        box.innerHTML=content[type];
        box.classList.add('show');
    },100);
}

</script>

</body>
</html>
